<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="robots" content="noindex">
<title>karmidd</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181d; --line:#242b33;
  --text:#e8edf2; --dim:#8b959f; --dim2:#5f6874; --acc:#a8e05f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px 16px;
}
.wrap{width:100%;max-width:520px}
h1{
  font-size:15px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;
}
h1 span{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.sub{font-size:13px;color:var(--dim2);margin:0 0 22px;padding-left:15px}

a.card{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 16px;margin-bottom:8px;
  transition:border-color .14s,background .14s,transform .14s;
}
a.card:hover{border-color:var(--acc);background:#171d16;transform:translateY(-1px)}
.ico{
  flex:none;width:38px;height:38px;border-radius:10px;background:#1e252c;
  display:grid;place-items:center;font-size:19px;
}
.body{flex:1;min-width:0}
.body b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em}
.body i{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:2px}
.arw{flex:none;color:var(--dim2);font-size:18px;transition:transform .14s,color .14s}
a.card:hover .arw{color:var(--acc);transform:translateX(2px)}

footer{margin-top:20px;font-size:11.5px;color:var(--dim2);padding-left:2px}
footer a{color:var(--dim2)}
</style>
</head>
<body>
  <div class="wrap">
    <h1><span></span>karmidd</h1>
    <p class="sub">Personal pages.</p>

    <!-- To add another page: make a folder (e.g. /notes/index.html),
         then copy one of these blocks and point it at /notes/. -->

    <a class="card" href="/training/">
      <div class="ico">🏋️</div>
      <div class="body">
        <b>Training</b>
        <i>Gym schedule and diet targets</i>
      </div>
      <div class="arw">→</div>
    </a>

  </div>
</body>
</html>
